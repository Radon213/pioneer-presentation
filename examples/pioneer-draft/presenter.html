<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pioneer · Presenter</title><link rel="stylesheet" href="../pioneer-interactive/assets/fonts.css"><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#fdfcf8;color:#0a0a0a;font-family:'Playfair Display',Georgia,serif}header{display:flex;justify-content:space-between;border-bottom:1px solid #c6c4be;padding-bottom:16px;font-size:24px}h1{font-size:38px;line-height:1.2;margin:28px 0 10px}.ko{font:20px/1.4 sans-serif;color:#555}.script{font-size:28px;line-height:1.7;max-width:1050px;margin-top:30px;white-space:pre-line}.next{margin-top:35px;border-top:1px solid #c6c4be;padding-top:20px;font-size:23px;color:#1a3a7a}nav{display:flex;gap:16px;margin-top:26px}button{background:#fdfcf8;color:#0a0a0a;border:1px solid #555;font:22px Georgia;padding:12px 24px;cursor:pointer}button:focus-visible{outline:3px solid #1a3a7a;outline-offset:3px}.help{font:16px sans-serif;color:#555;margin-top:22px}</style></head><body><header><span id="position">Waiting for audience window…</span><span id="timer">00:00</span></header><h1 id="title">Presenter notes</h1><p class="ko" id="ko"></p><div class="script" id="script">Keep the audience presentation open on the extended display. Press Right or Space to advance its build.</div><div class="next" id="next"></div><nav><button id="previous">Previous</button><button id="advance">Next build</button><button id="reset">Reset timer</button></nav><p class="help">Right / Space: next build · Left: previous · R: reset timer. These controls are only in the presenter window.</p><script type="module">const c=new BroadcastChannel('pioneer-draft-presenter');const $=s=>document.querySelector(s);let started=Date.now();const command=action=>c.postMessage({type:'command',action});c.onmessage=e=>{const d=e.data;if(d.type!=='state')return;$('#position').textContent=`Slide ${d.page}/${d.total} · Stage ${d.step+1}/${d.slide.steps+1} · target ${d.slide.duration}s`;$('#title').textContent=d.slide.title;$('#ko').textContent=d.slide.ko;$('#script').textContent=d.slide.notes.replace('한국어:','\n\n한국어:');$('#next').textContent=d.next?`Next slide: ${d.next.title}`:'Final slide';};$('#previous').onclick=()=>command('previous');$('#advance').onclick=()=>command('next');$('#reset').onclick=()=>started=Date.now();let heldKey=null,holdTimer=0;function releaseHold(){clearTimeout(holdTimer);heldKey=null;command('hold-stop');}addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const forward=['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key),back=['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key);if(forward||back){e.preventDefault();if(e.repeat||heldKey===e.key)return;releaseHold();heldKey=e.key;command(forward?'next':'previous');if(e.key.startsWith('Arrow'))holdTimer=setTimeout(()=>command(forward?'hold-next':'hold-previous'),180);}else if(e.key.toLowerCase()==='r')started=Date.now();});addEventListener('keyup',e=>{if(e.key===heldKey)releaseHold();});addEventListener('blur',releaseHold);setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);$('#timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;},500);command('request');</script></body></html>
